<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02151f">
<title>Taxi1729 Poll</title>
<link rel="icon" href="/assets/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/shared/theme.css">
<style>
  html, body { min-height: 100%; background: var(--navy); color: var(--white); }
  body { -webkit-tap-highlight-color: transparent; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px; }
  header img { height: 40px; }
  header .code { font-family: "Raleway", sans-serif; font-size: 13px; color: var(--muted); text-align: right; }
  header .code b { display: block; color: var(--white); font-family: "Inter", sans-serif; font-weight: 800; letter-spacing: .12em; font-size: 16px; }
  main { padding: 8px 16px 90px; max-width: 560px; margin: 0 auto; }
  .screen { animation: in .35s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .center { text-align: center; padding-top: 14vh; }
  .pulse { width: 18px; height: 18px; border-radius: 50%; background: var(--yellow); margin: 0 auto 28px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .35; } }
  h2 { font-weight: 800; font-size: 27px; margin: 0 0 10px; letter-spacing: -.01em; }
  p.sub { font-family: "Raleway", sans-serif; color: var(--muted); margin: 0; font-size: 17px; line-height: 1.45; }
  .kicker { font-family: "Raleway", sans-serif; font-weight: 400; color: var(--yellow); letter-spacing: .08em; font-size: 13px; text-transform: uppercase; }
  h1 { font-weight: 800; font-size: 25px; line-height: 1.18; margin: 8px 0 8px; letter-spacing: -.01em; }
  .howmany { font-family: "Raleway", sans-serif; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 16px 16px; margin-bottom: 10px; border-radius: 14px;
    border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: var(--white);
    font: 500 17px "Raleway", sans-serif; cursor: pointer; transition: border-color .15s, background .15s; }
  .opt .mark { flex: none; width: 22px; height: 22px; border: 2px solid rgba(255,255,255,.4); border-radius: 50%; display: grid; place-items: center; }
  .opt.multi .mark { border-radius: 6px; }
  .opt.sel { border-color: var(--yellow); background: rgba(232,234,110,.12); }
  .opt.sel .mark { background: var(--yellow); border-color: var(--yellow); }
  .opt.sel .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--navy); }
  .opt.multi.sel .mark::after { border-radius: 2px; }
  .send { width: 100%; padding: 17px; border: 0; border-radius: 14px; background: var(--yellow); color: var(--navy);
    font: 800 17px "Inter", sans-serif; margin-top: 8px; cursor: pointer; }
  .send:disabled { opacity: .35; }
  .check { width: 64px; height: 64px; border-radius: 50%; background: var(--yellow); color: var(--navy); display: grid; place-items: center;
    font-size: 34px; font-weight: 800; margin: 0 auto 22px; }
  .enter input { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,.2); background: transparent;
    color: #fff; font: 800 26px "Inter", sans-serif; text-align: center; letter-spacing: .2em; text-transform: uppercase; margin: 22px 0 12px; }
  .enter input:focus { outline: none; border-color: var(--yellow); }
  .net { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 12px; color: var(--muted);
    background: rgba(0,0,0,.35); padding: 5px 12px; border-radius: 99px; white-space: nowrap; }
  .net.off { color: #ffd3cf; background: rgba(194,65,58,.45); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 60px; max-width: 528px; margin: 0 auto; background: #fff; color: var(--ink);
    padding: 12px 14px; border-radius: 12px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .numbox { display: flex; align-items: baseline; gap: 10px; border: 2px solid rgba(255,255,255,.2); border-radius: 14px; padding: 6px 16px; margin: 8px 0 10px; transition: border-color .15s; }
  .numbox:focus-within { border-color: var(--yellow); }
  .numbox.bad { border-color: #f28f86; }
  .numbox input { flex: 1; min-width: 0; border: 0; background: transparent; color: #fff; font: 800 34px "Inter", sans-serif; padding: 8px 0; outline: none; }
  .numbox input::placeholder { color: rgba(255,255,255,.25); }
  .numbox .unit { font-family: "Raleway", sans-serif; color: var(--muted); font-size: 18px; white-space: nowrap; }
  .numerr { color: #ffb4ac; font-weight: 600; font-size: 15px; min-height: 22px; margin-bottom: 8px; }
  .staff { display: block; text-align: center; margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <img src="/assets/logo-negativo.png" alt="Taxi1729">
  <div class="code hidden" id="codeBox">Evento<b id="code">—</b></div>
</header>
<main id="main"></main>
<div class="net hidden" id="net">connessione…</div>
<div class="toast hidden" id="toast"></div>

<script src="/shared/api.js"></script>
<script>
(function () {
  var main = document.getElementById("main"), net = document.getElementById("net"), toastEl = document.getElementById("toast");
  var params = new URLSearchParams(location.search);
  var code = (params.get("e") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  var voter = T.store("t1729-voter");
  if (!voter) { voter = "v" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); T.store("t1729-voter", voter); }
  var current = null, selected = [], votedIds = {}, typed = "";
  var esc = T.esc, toastTimer;

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.add("hidden"); }, 3500);
  }

  if (!code) return renderEnter();
  T.api("join/" + code).then(function (ev) {
    document.getElementById("code").textContent = ev.code;
    document.getElementById("codeBox").classList.remove("hidden");
    document.title = ev.name + " · Taxi1729";
    renderWait();
    net.classList.remove("hidden");
    var conn = T.live({ role: "audience", code: code, voter: voter }, onMsg, function (ok) {
      net.textContent = ok ? "● in diretta" : "connessione persa, riprovo…";
      net.classList.toggle("off", !ok);
    });
    window.__vote = function (qid, choices) { conn.send({ t: "vote", q: qid, choices: choices }); };
    window.__estimate = function (qid, value) { conn.send({ t: "vote", q: qid, value: value }); };
  }, function (e) {
    renderEnter(e.status === 404 ? "Codice evento non trovato. Controlla e riprova." : e.message);
  });

  function onMsg(m) {
    if (m.t === "state") {
      var q = m.q;
      if (!q) { if (current) { current = null; renderWait(); } return; }
      if (m.voted) votedIds[q.id] = true;
      var same = current && current.id === q.id && JSON.stringify(current) === JSON.stringify(q);
      current = q;
      if (votedIds[q.id]) return renderDone();
      if (!same) { selected = []; typed = ""; renderPoll(); }
    } else if (m.t === "voted") {
      votedIds[m.q] = true;
      if (current && current.id === m.q) renderDone();
    } else if (m.t === "error") {
      toast(m.msg); if (current) renderPoll();
    }
  }

  function renderEnter(errMsg) {
    main.innerHTML = '<div class="screen center enter"><div class="kicker">Benvenuto</div><h2 style="margin-top:8px">Inserisci il codice dell\'evento</h2>' +
      '<p class="sub">Lo trovi sullo schermo, sotto il QR code.</p>' +
      '<input id="ec" inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="10" aria-label="Codice evento">' +
      '<button class="send" id="go">Entra</button>' +
      (errMsg ? '<p class="sub" style="color:#ffb4ac;margin-top:14px">' + esc(errMsg) + '</p>' : '') +
      '<a class="staff" href="/admin">Area riservata</a></div>';
    var inp = document.getElementById("ec");
    inp.value = code;
    function go() { var v = inp.value.trim(); if (v) location.search = "?e=" + encodeURIComponent(v); }
    document.getElementById("go").onclick = go;
    inp.onkeydown = function (e) { if (e.key === "Enter") go(); };
  }
  function renderWait() {
    main.innerHTML = '<div class="screen center"><div class="pulse"></div><h2>Tieni d\'occhio lo schermo</h2>' +
      '<p class="sub">La prossima domanda comparirà qui in automatico.</p></div>';
  }
  function renderDone() {
    main.innerHTML = '<div class="screen center"><div class="check">✓</div><h2>Risposta inviata</h2>' +
      '<p class="sub">Grazie! Guarda i risultati sullo schermo.</p></div>';
  }
  function crowdHint(q) {
    var s = q.decimals ? "Inserisci un numero" : "Inserisci un numero intero";
    if (q.min != null && q.max != null) s += " tra " + T.fmtNum(q.min) + " e " + T.fmtNum(q.max);
    else if (q.min === 0 && !q.decimals) s = "Inserisci un numero intero positivo o zero";
    else if (q.min != null) s += " non inferiore a " + T.fmtNum(q.min);
    else if (q.max != null) s += " non superiore a " + T.fmtNum(q.max);
    return s;
  }
  // Crowd Wisdom: il pubblico scrive la sua stima (numero libero, virgola per i decimali)
  function renderCrowd() {
    var q = current;
    main.innerHTML = '<div class="screen"><div class="kicker">Crowd Wisdom</div><h1>' + esc(q.title || "Qual è la tua stima?") + '</h1>' +
      '<div class="howmany">Scrivi la tua stima</div>' +
      '<div class="numbox" id="nb"><input id="num" type="text" inputmode="' + (q.decimals || (q.min != null && q.min < 0) || q.min == null ? "decimal" : "numeric") + '" autocomplete="off" placeholder="0" aria-label="La tua stima">' +
      (q.unit ? '<span class="unit">' + esc(q.unit) + '</span>' : '') + '</div>' +
      '<div class="numerr" id="nerr"></div>' +
      '<button class="send" id="send">Invia</button></div>';
    var inp = document.getElementById("num"), nerr = document.getElementById("nerr"), nb = document.getElementById("nb"), send = document.getElementById("send");
    inp.value = typed;
    function check() {
      var v = T.parseNum(inp.value);
      var ok = !isNaN(v) && (q.decimals || Math.round(v) === v) && (q.min == null || v >= q.min) && (q.max == null || v <= q.max);
      return ok ? v : null;
    }
    inp.oninput = function () { typed = inp.value; nb.classList.remove("bad"); nerr.textContent = ""; };
    function submit() {
      var v = check();
      if (v === null) { nb.classList.add("bad"); nerr.textContent = inp.value.trim() ? (q.error || crowdHint(q)) : "Scrivi la tua stima."; inp.focus(); return; }
      send.disabled = true; send.textContent = "Invio…";
      window.__estimate(q.id, v);
    }
    send.onclick = submit;
    inp.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); submit(); } };
  }
  function renderPoll() {
    var q = current;
    if (q.kind === "cw") return renderCrowd();
    var html = '<div class="screen"><div class="kicker">Sondaggio</div>' + (q.title ? '<h1>' + esc(q.title) + '</h1>' : '<h1>Scegli la tua risposta</h1>') +
      '<div class="howmany">' + (q.multi ? "Puoi scegliere più risposte" : "Scegli una risposta") + '</div>';
    q.options.forEach(function (o, i) {
      html += '<button class="opt' + (q.multi ? ' multi' : '') + (selected.indexOf(i) >= 0 ? ' sel' : '') + '" data-i="' + i + '"><span class="mark"></span><span>' + esc(T.optLabel(o, i)) + '</span></button>';
    });
    html += '<button class="send" id="send"' + (selected.length ? '' : ' disabled') + '>Invia</button></div>';
    main.innerHTML = html;
    Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-i");
        if (q.multi) { var k = selected.indexOf(i); if (k >= 0) selected.splice(k, 1); else selected.push(i); }
        else selected = [i];
        Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (x) { x.classList.toggle("sel", selected.indexOf(+x.getAttribute("data-i")) >= 0); });
        document.getElementById("send").disabled = !selected.length;
      };
    });
    document.getElementById("send").onclick = function () {
      if (!selected.length) return;
      this.disabled = true; this.textContent = "Invio…";
      window.__vote(q.id, selected.slice());
    };
  }
})();
</script>
</body>
</html>
